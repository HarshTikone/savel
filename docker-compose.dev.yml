# Local stack: TimescaleDB + api + sim.  cp .env.example .env && docker compose -f docker-compose.dev.yml up -d --build
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: savel
    ports: ["5432:5432"]
    volumes:
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d savel"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: {context: ., dockerfile: api/Dockerfile}
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/savel
      SIM_URL: http://sim:8001
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  sim:
    build: {context: ., dockerfile: sim/Dockerfile}
    env_file: [{path: .env, required: false}]
    environment:
      INGEST_URL: http://api:8000/api/ingest
    ports: ["8001:8001"]   # dev only; production keeps the simulator internal
    depends_on:
      api: {condition: service_healthy}
